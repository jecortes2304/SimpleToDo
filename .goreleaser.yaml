version: 2

project_name: simpletodo

builds:
  - id: simpletodo
    main: ./cmd/app
    binary: simpletodo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X simpletodo/internal/buildinfo.Version={{ .Version }}
      - -X simpletodo/internal/buildinfo.Commit={{ .FullCommit }}
      - -X simpletodo/internal/buildinfo.BuildTime={{ .CommitDate }}

archives:
  - id: application
    ids:
      - simpletodo
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: >-
    {{ if index .Env "RELEASE_VERSION" }}{{ .Env.RELEASE_VERSION }}{{ else }}{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}{{ end }}

changelog:
  disable: true
